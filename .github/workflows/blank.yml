
name: Build Toretto AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3

      - name: Распаковать проект
        run: |
          set -e
          unzip -o TorettoAI-source.zip -d extracted

      - name: Показать настройки проекта
        run: |
          cd extracted/TorettoAI
          echo "=== Корневые настройки ==="
          cat build.gradle.kts
          echo "=== Настройки приложения ==="
          cat app/build.gradle.kts
          echo "=== Настройки проекта ==="
          cat settings.gradle.kts

      - name: Собрать APK
        run: |
          cd extracted/TorettoAI
          gradle assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: TorettoAI-debug-apk
          path: extracted/TorettoAI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
