
name: Build Toretto AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4

      - name: Распаковать и проверить проект
        run: |
          set -e
          mkdir -p extracted
          unzip -o TorettoAI-source.zip -d extracted
          echo "=== Содержимое архива ==="
          find extracted -maxdepth 4 -type f | head -200
          echo "=== Файлы сборки Android ==="
          find extracted -type f \( \
            -name gradlew -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts -o \
            -name AndroidManifest.xml \
          \) -print

      - name: Сохранить распакованные исходники
        uses: actions/upload-artifact@v4
        with:
          name: TorettoAI-source-inspection
          path: extracted/
          if-no-files-found: error
          retention-days: 7
          
