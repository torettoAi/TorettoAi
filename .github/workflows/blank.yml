name: Build Toretto AI APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Скачать исходный код
    uses: actions/checkout@v4

  - name: Установить Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Настроить Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Настроить Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: 'platform-tools'

  - name: Распаковать проект
    run: |
      set -e
      unzip -o TorettoAI-source.zip -d extracted

  - name: Исправить настройки Java и Kotlin
    run: |
      python3 - <<'PY'
      from pathlib import Path
      import re

      p = Path("extracted/TorettoAI/app/build.gradle.kts")
      if not p.exists():
          raise SystemExit(f"Не найден файл проекта: {p}")

      s = p.read_text()

      s = re.sub(
          r'JavaVersion\.VERSION_1_8',
          'JavaVersion.VERSION_17',
          s
      )
      s = re.sub(
          r'JavaVersion\.VERSION_8\b',
          'JavaVersion.VERSION_17',
          s
      )

      if 'compileOptions {' in s:
          s = re.sub(
              r'compileOptions\s*\{.*?\}',
              '''compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }''',
              s,
              count=1,
              flags=re.S
          )
      else:
          s = s.replace(
              'android {',
              '''android {
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }''',
              1
          )

      if 'kotlinOptions {' in s:
          s = re.sub(
              r'kotlinOptions\s*\{.*?\}',
              '''kotlinOptions {
                  jvmTarget = "17"
              }''',
              s,
              count=1,
              flags=re.S
          )
      else:
          s = s.replace(
              'android {',
              '''android {
                  kotlinOptions {
                      jvmTarget = "17"
                  }''',
              1
          )

      p.write_text(s)
      print("Настройки Java и Kotlin обновлены.")
      print(s)
      PY

  - name: Собрать APK
    run: |
      cd extracted/TorettoAI
      gradle assembleDebug

  - name: Сохранить APK
    uses: actions/upload-artifact@v4
    with:
      name: TorettoAI-debug-apk
      path: extracted/TorettoAI/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
